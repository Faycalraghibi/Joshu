[mypy]
python_version = 3.8
warn_return_any = False
warn_unused_configs = True
no_implicit_optional = False
disallow_untyped_defs = False
disallow_any_generics = False
check_untyped_defs = False

# Disable error codes that would require deep refactoring
disable_error_code = arg-type, return-value, assignment, attr-defined, var-annotated, truthy-function, index, import-untyped, call-arg
