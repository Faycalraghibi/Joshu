[mypy]
python_version = 3.8
warn_return_any = False
warn_unused_configs = True
no_implicit_optional = False
disallow_untyped_defs = False
disallow_any_generics = False
check_untyped_defs = False
ignore_missing_imports = True

# Exclude virtual environments and installed packages
exclude = (?x)(
    \.joshuvenv
    | \.venv
    | site-packages
  )

# Disable error codes that would require deep refactoring
disable_error_code = arg-type, return-value, assignment, attr-defined, var-annotated, truthy-function, index, import-untyped, call-arg, misc, union-attr, typeddict-item

# Skip problematic packages that cause internal errors
[mypy-transformers.*]
follow_imports = skip
ignore_errors = True

[mypy-torch.*]
follow_imports = skip
ignore_errors = True

[mypy-sentence_transformers.*]
follow_imports = skip
ignore_errors = True

[mypy-chromadb.*]
follow_imports = skip
ignore_errors = True


