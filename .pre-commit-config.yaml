repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: ["--ignore-missing-imports"]
        additional_dependencies:
          - types-requests
          - types-setuptools

  - repo: local
    hooks:
      - id: clear-cache-files
        name: Clear cache and session files
        entry: python -c "import os; files=[r'~\.joshu\cache\translation_cache.json', '.joshu_data.json', '.joshu_sessions.json']; [open(f, 'w').write('{}\n') if os.path.exists(f) and f.endswith('.json') else None for f in files]; print('Cleared cache and session files')"
        language: system
        pass_filenames: false
        always_run: true
