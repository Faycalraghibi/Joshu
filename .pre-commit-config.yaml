repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.8
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Note: Black removed - using ruff-format instead (they're compatible)

  - repo: https://github.com/PyCQA/isort
    rev: 7.0.0
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.0
    hooks:
      - id: mypy
        args: ["--config-file", "mypy.ini"]
        additional_dependencies:
          - types-requests
          - types-setuptools

  - repo: local
    hooks:
      - id: clear-cache-files
        name: Clear cache and session files
        entry: |
          python -c "
          import os
          files = ['./cache/joshu_data.json', './cache/joshu_sessions.json']
          for f in files:
              if os.path.exists(f) and f.endswith('.json'):
                  open(f, 'w').write('{}\\n')
          print('Cleared cache and session files')
          "
        language: system
        pass_filenames: false
        always_run: true
