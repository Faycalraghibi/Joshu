[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opencli-assistant"
version = "0.1.0"
description = "Open-source command-line AI assistant"
readme = "README.md"
requires-python = ">=3.8,<3.12"
authors = [{ name = "OpenCLI Community" }]
license = { file = "LICENSE" }
keywords = ["cli", "ai", "assistant", "llm"]

[project.scripts]
opencli = "opencli.ui.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

