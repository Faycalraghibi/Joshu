[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "joshu"
version = "0.1.0"
description = "Joshu - AI command-line assistant"
readme = "README.md"
requires-python = ">=3.8,<3.12"
authors = [{ name = "Joshu Community" }]
license = { file = "LICENSE" }
keywords = ["cli", "ai", "assistant", "llm"]

[project.scripts]
joshu = "joshu.ui.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

