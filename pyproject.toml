[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "joshu"
version = "0.1.0"
description = "Joshu - AI command-line assistant"
readme = "README.md"
requires-python = ">=3.8,<3.14"
authors = [{ name = "Joshu Community" }]
license = { file = "LICENSE" }
keywords = ["cli", "ai", "assistant", "llm"]
dependencies = [
    "openai==1.22.0",
    "httpx==0.27.0",
    "typer==0.20.0",
    "rich==14.2.0",
    "pydantic==2.12.3",
    "python-dotenv==1.2.1",
    "prompt_toolkit==3.0.52",
    "requests==2.32.5",
    "tqdm==4.67.1",
    "PyYAML==6.0.3",
    "duckduckgo-search>=6.0.0"
]

[project.optional-dependencies]
# Development tools (testing, linting, formatting)
dev = [
    "pytest==8.4.2",
    "black==24.4.0",
    "flake8==7.0.0",
    "mypy==1.8.0",
    "ruff==0.2.0",
    "types-PyYAML==6.0.12.12"
]
# LLM dependencies for local model support (optional, may require compilation)
# Note: These dependencies are large and may take time to install
# On Windows, sentencepiece may need: pip install --only-binary=sentencepiece sentencepiece
llm = [
    "transformers==4.36.2",
    "torch==2.9.0",
    "huggingface_hub==0.23.0",
    "llama-cpp-python==0.2.55",
    "sentencepiece==0.1.99"
]
# Semantic memory dependencies (vector database and embeddings)
# Requires: chromadb for local vector storage, sentence-transformers for embeddings
semantic = [
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0"
]

[project.scripts]
joshu = "joshu.ui.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
fix = true

[tool.isort]
profile = "black"

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = false
warn_unused_configs = true
no_implicit_optional = false
disallow_untyped_defs = false
disallow_any_generics = false
check_untyped_defs = false
# Disable specific error codes that require deep refactoring
disable_error_code = ["arg-type", "return-value", "assignment", "attr-defined", "var-annotated", "truthy-function", "index", "import-untyped"]
