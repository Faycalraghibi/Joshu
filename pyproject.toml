[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "joshu"
version = "0.2.0"
description = "Joshu - AI command-line assistant"
readme = "README.md"
requires-python = ">=3.10,<3.15"
authors = [{ name = "Joshu Community" }]
license = { file = "LICENSE" }
keywords = ["cli", "ai", "assistant", "llm"]
dependencies = [
    "openai>=1.54.0",
    "typer==0.20.0",
    "rich==14.2.0",
    "pydantic==2.12.3",
    "python-dotenv==1.2.1",
    "prompt_toolkit==3.0.52",
    "requests==2.32.5",
    "tqdm==4.67.1",
    "PyYAML==6.0.3",
    "ddgs>=9.0.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
# Development dependencies (testing, linting, formatting, pre-commit)
dev = [
    # Testing
    "pytest==8.4.2",
    "pytest-mock>=3.12.0",
    # Code quality
    "black==24.4.0",
    "flake8==7.0.0",
    "mypy==1.8.0",
    "ruff==0.2.0",
    "isort==5.13.2",
    # Pre-commit
    "pre-commit>=3.5.0",
    # Type stubs
    "types-PyYAML==6.0.12.12",
    "types-requests>=2.31.0",
    # A2A server tests
    "fastapi>=0.110.0",
]

# A2A server (joshu serve)
a2a = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

# End-user dependencies (all optional features for production use)
use = [
    # Semantic memory (vector database and embeddings)
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
]

[project.scripts]
joshu = "joshu.ui.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
fix = true

[tool.isort]
profile = "black"

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_configs = true
no_implicit_optional = false
disallow_untyped_defs = false
disallow_any_generics = false
check_untyped_defs = false
# Disable specific error codes that require deep refactoring
disable_error_code = ["arg-type", "return-value", "assignment", "attr-defined", "var-annotated", "truthy-function", "index", "import-untyped"]
