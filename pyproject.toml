[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "joshu"
version = "0.1.0"
description = "Joshu - AI command-line assistant"
readme = "README.md"
requires-python = ">=3.8,<3.14"
authors = [{ name = "Joshu Community" }]
license = { file = "LICENSE" }
keywords = ["cli", "ai", "assistant", "llm"]
dependencies = [
    "openai==1.22.0",
    "httpx==0.27.0",
    "typer==0.20.0",
    "rich==14.2.0",
    "pydantic==2.12.3",
    "python-dotenv==1.2.1",
    "prompt_toolkit==3.0.52",
    "requests==2.32.5",
    "tqdm==4.67.1",
    "PyYAML==6.0.3"
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "black==24.4.0",
    "flake8==7.0.0"
]
llm = [
    "transformers==4.36.2",
    "torch==2.9.0",
    "huggingface_hub==0.23.0",
    "llama-cpp-python==0.2.55",
    "sentencepiece==0.1.99"
]

[project.scripts]
joshu = "joshu.ui.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]